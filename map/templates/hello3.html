{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rain Map Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        
        .map-container {
            position: relative;
            width: 752px; /* 50 cells * 15px + 1px gaps */
            height: 452px; /* 30 cells * 15px + 1px gaps */
        }
        
        #mapImage {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .grid-container {
            position: absolute;
            display: grid;
            grid-template-columns: repeat(50, 15px);
            grid-template-rows: repeat(30, 15px);
            gap: 1px;
            width: 100%;
            height: 100%;
        }
        
        .cell {
            width: 15px;
            height: 15px;
            background-color: transparent;
            border: 1px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .cell:hover {
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
        }
        
        .controls {
            margin-bottom: 20px;
        }
        
        button {
            padding: 8px 12px;
            margin-right: 10px;
            cursor: pointer;
        }
        
        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Rain Map Demo</h1>
    
    <div class="controls">
        <textarea id="dataInput" placeholder="Paste your 30x50 data here (values between 0.1-3.0, comma or space separated)"></textarea>
        <button id="applyData">Apply Data</button>
        <button id="clearGrid">Clear Grid</button>
    </div>
    
    <div class="map-container">
        <!-- Map image (replace with your actual map) -->
        {% comment %} <img id="mapImage" src="https://maps.googleapis.com/maps/api/staticmap?size=752x452&maptype=terrain&scale=2&zoom=5&center=37.0902,-95.7129" alt="Map Background"> {% endcomment %}
        <img style="width:106%;height:106%" id="mapImage" src="{% static 'map.png' %}" alt="Map ">

        <!-- Color overlay grid -->
        <div class="grid-container" id="grid"></div>
    </div>
    
    <script>
        // Grid dimensions
        const COLS = 50;
        const ROWS = 30;
        
        // Create empty grid data structure
        let gridData = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        
        // Get color based on value
        function getColorForValue(value) {
            value = parseFloat(value);
            
            if (value <= 0) return 'transparent';
            
            // Blue to Aqua to Yellow gradient
            if (value <= 0.5) {
                // Blue (0.1-0.5)
                const intensity = (value - 0.1) / 0.4; // Normalize to 0-1
                const alpha = Math.min(0.7, 0.3 + intensity * 0.4);
                return `rgba(0, 0, ${Math.floor(128 + intensity * 127)}, ${alpha})`;
            }
            else if (value <= 1.0) {
                // Aqua (0.5-1.0)
                const intensity = (value - 0.5) / 0.5; // Normalize to 0-1
                const alpha = 0.7;
                return `rgba(0, ${Math.floor(128 + intensity * 127)}, ${Math.floor(255 - intensity * 127)}, ${alpha})`;
            }
            else {
                // Yellow (1.0-3.0)
                const intensity = Math.min(1, (value - 1.0) / 2.0); // Normalize to 0-1
                const alpha = 0.5 + intensity * 0.3;
                return `rgba(255, 255, ${Math.floor(200 - intensity * 150)}, ${alpha})`;
            }
        }
        
        // Initialize the grid with transparent cells
        function initGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.dataset.value = 0;
                    
                    // Click to increase value
                    cell.addEventListener('click', function() {
                        const currentVal = parseFloat(this.dataset.value) || 0;
                        let newVal = currentVal + 0.1;
                        if (newVal > 3.0) newVal = 0;
                        this.dataset.value = newVal.toFixed(1);
                        this.style.backgroundColor = getColorForValue(newVal);
                    });
                    
                    grid.appendChild(cell);
                }
            }
        }
        
        // Update grid with data
        function updateGrid(data) {
            const cells = document.querySelectorAll('.cell');
            
            for (let row = 0; row < ROWS; row++) {
                for (let col = 0; col < COLS; col++) {
                    const value = data[row][col];
                    const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
                    
                    if (cell) {
                        cell.dataset.value = value;
                        cell.style.backgroundColor = getColorForValue(value);
                    }
                }
            }
        }
        
        // Parse input data
        function parseInputData(input) {
            const lines = input.trim().split('\n');
            const data = [];
            
            for (let row = 0; row < ROWS; row++) {
                const line = lines[row] || '';
                // Split by commas or whitespace
                const values = line.split(/[, \t]+/).filter(v => v !== '');
                const rowData = [];
                
                for (let col = 0; col < COLS; col++) {
                    // Use 0 if no data provided
                    const value = parseFloat(values[col]) || 0;
                    // Clamp to 0-3 range
                    rowData[col] = Math.max(0, Math.min(3.0, value));
                }
                
                data.push(rowData);
            }
            
            return data;
        }
        
        // Event listeners
        document.getElementById('applyData').addEventListener('click', function() {
            const input = document.getElementById('dataInput').value;
            const parsedData = parseInputData(input);
            updateGrid(parsedData);
        });
        
        document.getElementById('clearGrid').addEventListener('click', function() {
            document.getElementById('dataInput').value = '';
            const emptyData = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            updateGrid(emptyData);
        });
        
        // Initialize the grid on page load
        window.onload = initGrid;
    </script>
</body>
</html>
