{% load static %}
{% load bootstrap5 %}
{% bootstrap_css %}
{% bootstrap_javascript %}
<link rel="stylesheet" href="{% static 'login.css' %}">
<body>
    <div id="register">
        <div class="container">
            <div id="register-row" class="row justify-content-center align-items-center">
                <div id="register-column" class="col-md-6">
                    <div id="register-box" class="col-md-12">
                        <form id="register-form" class="form" action="" method="post">
                                {% csrf_token %}
                            <h3 class="text-center text-info">Register</h3>
                            <div class="form-group pt-2">
                                <label for="username" class="text-info">Username:</label><br>
                                <input type="text" name="username" id="username" class="form-control" required>
                            </div>
                            <div class="form-group pt-2">
                                <label for="password" class="text-info">Password:</label><br>
                                <input type="password" name="password" id="password" class="form-control" required>
                            </div>
                            
                            <div class="form-group pt-2">
                                <label for="password" class="text-info">Re-type password:</label><br>
                                <input type="password" name="retype_password" id="retype_password" class="form-control" required>
                            </div>

                            <div class="form-group pt-2 d-flex">
                                <div class="pt-4 flex-grow-1">
                                    <input type="submit" name="submit" class="btn btn-info btn-md text-light" value="Create">
                                    <a href="{% url 'login' %}" class="btn btn-info btn-md text-light">Back</a>
                                </div>

                                <div class="pt-4">
                                    {% if messages %}
                                            {% for message in messages %}
                                            <span {% if message.tags %} class="{{ message.tags }}">{% endif %}{{ message }}</span><br>
                                            {% endfor %}
                                    {% endif %}
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
